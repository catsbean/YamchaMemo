[package]
name = "yamcha-app"
version = "0.5.1"
edition = "2021"

[lib]
name = "yamcha_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "gzip"] }
notify-debouncer-full = "0.5"
# 첨부 문서 추출기(pdf·hwp·오피스)는 yamcha-core의 기본 feature "docs"로 들어온다.
# 초경량 빌드가 필요하면 여기에 `default-features = false`를 붙인다 — 설치본이
# 약 3MB 줄고 `📄 파일 속` 토글은 아무 문서도 찾지 못한다.
#
# 앱 쪽에 default feature로 두지 않는 이유: `tauri dev`가 cargo를
# `--no-default-features`로 실행해서, dev에서만 문서 검색이 조용히 꺼진다.
yamcha-core = { path = "../crates/yamcha-core" }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
