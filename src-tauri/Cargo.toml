[package]
name = "yamcha-app"
version = "0.5.1"
edition = "2021"

[lib]
name = "yamcha_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
serde = { workspace = true }
serde_json = { workspace = true }
specta = { workspace = true }
specta-typescript = "0.0.9"
tauri-specta = { version = "=2.0.0-rc.21", features = ["derive", "typescript"] }
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "gzip"] }
notify-debouncer-full = "0.5"
# 첨부 문서 추출기(pdf·hwp·오피스)는 yamcha-core의 기본 feature "docs"로 들어온다.
# 초경량 빌드가 필요하면 여기에 `default-features = false`를 붙인다 — 설치본이
# 약 3MB 줄고 `📄 파일 속` 토글은 아무 문서도 찾지 못한다.
#
# 앱 쪽에 default feature로 두지 않는 이유: `tauri dev`가 cargo를
# `--no-default-features`로 실행해서, dev에서만 문서 검색이 조용히 꺼진다.
yamcha-core = { path = "../crates/yamcha-core" }
tauri-plugin-global-shortcut = "2.3.2"
# 스크랩(7-3)의 숨은 창 왕복 — eval_with_callback 결과를 oneshot으로 받고 timeout을 건다.
# tokio 런타임 자체는 tauri가 이미 돌리고 있으므로 sync·time만 있으면 된다.
tokio = { version = "1", features = ["sync", "time"] }
url = "2"
# 웹 스크랩 본문 추출 (7-0에서 검증) — 갈래①(원본 HTML)·갈래②(숨은 창 렌더링) 둘 다
# 같은 파이프라인을 쓴다. htmd가 HTML→마크다운을 맡는다.
readability = "0.3"
htmd = "0.5"
chrono = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
