name: CI

# push·PR마다 테스트와 정적 검사를 돌린다. 릴리스(release.yml)는 태그를 받아
# 설치본을 만들 뿐이라, 깨진 코드가 태그까지 갔다가 거기서 처음 드러나면 늦다.
on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에 연달아 push하면 앞선 실행은 취소한다 (뒤엣것만 의미가 있다)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # 개발·배포 환경과 같은 Windows에서 돈다. yamcha-app은 웹뷰에 묶여 있어
    # Linux에서 돌리려면 시스템 패키지를 따로 깔아야 하는데, 얻는 게 없다.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # release.yml과 같은 버전으로 고정 (메이저만 적으면 새 pnpm이 요구하는
          # Node 버전이 올라갈 때 갑자기 깨진다)
          version: 11.13.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          # 루트 Cargo.toml이 워크스페이스라 산출물은 루트 target/에 쌓인다
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Frontend tests
        run: pnpm test

      # tsc(타입체크) + vite build. **cargo보다 먼저** 해야 한다 —
      # tauri-build가 frontendDist(../dist)를 찾는데 dist/는 커밋하지 않는다.
      - name: Build frontend
        run: pnpm build

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --workspace
