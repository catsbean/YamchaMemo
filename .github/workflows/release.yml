name: Release

# vX.Y.Z 태그를 push하면 Windows·macOS 설치본을 빌드해 GitHub Release 초안으로 올린다.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    # 서드파티 액션은 모두 커밋 SHA로 고정한다(뒤의 주석이 원래 태그). 태그는 옮겨질 수 있어서,
    # 그 저장소 하나가 털리면 이 잡이 다루는 업데이트 서명 키가 새어 나간다 — 그 키면 모든 설치본에
    # 서명된 악성 업데이트를 보낼 수 있다(보안 점검 20261113). 올릴 때는 docs/RELEASE.md 참고.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # 토큰을 .git/config에 남기지 않는다 — 뒤 단계는 필요한 곳에만 GH_TOKEN을 따로 받는다
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          # 로컬 개발 환경과 같은 버전으로 고정한다. 메이저만 적으면 최신
          # 11.x가 깔려서, 새 pnpm이 요구하는 Node 버전이 올라갈 때 갑자기
          # 깨진다(11.20이 Node 22.13+를 요구해 실제로 한 번 깨졌다).
          version: 11.13.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # pnpm 11은 node:sqlite를 쓰므로 Node 22.13 미만에서는 실행되지
          # 않는다. 로컬과 같은 24로 맞춘다.
          node-version: 24
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # SHA로 고정하면 ref 이름에서 툴체인을 읽지 못하므로 직접 적는다
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # 루트 Cargo.toml이 워크스페이스(src-tauri + crates/yamcha-core)라
          # 산출물은 루트 target/에 쌓인다. src-tauri/target은 생기지 않으므로
          # 그쪽을 가리키면 캐시가 아무것도 잡지 못한다.
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: pnpm install

      # 이 판의 CHANGELOG.md 절 → 릴리스 설명과 latest.json의 notes(앱의 업데이트 창).
      # 업데이트 창의 설명은 빌드할 때 정해진다 — Publish 전에 릴리스 설명을 고쳐도 안 들어간다.
      # 절이 없으면 여기서 멈춘다(빈 설명으로 내보내지 않게 — release.bat도 미리 본다).
      - name: Release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          {
            echo "body<<CHANGELOG_EOF"
            node scripts/changelog.mjs section "${GITHUB_REF_NAME#v}"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      # 자동 업데이트 서명 키 (docs/RELEASE.md "업데이트 서명 키"). 설치본마다 .sig를 만들고
      # tauri-action이 latest.json을 릴리스에 올린다 — 앱은 이 파일을 보고 새 버전을 받는다.
      # 없으면 빌드가 실패한다(tauri.conf.json에 공개 키가 있으므로).
      #
      # Secret에 붙여 넣을 때 끝에 줄바꿈이 딸려 들어가면 설치본까지 다 만든 뒤 서명에서
      # "Invalid symbol 10"으로 죽는다(0.7.0에서 실제로 겪었다). 키는 base64 한 줄이라
      # 공백·줄바꿈을 모두 걷고, 비밀번호는 줄바꿈만 걷어 다음 단계로 넘긴다.
      - name: Prepare updater signing key
        shell: bash
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RAW_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          key=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')
          password=$(printf '%s' "$RAW_PASSWORD" | tr -d '\r\n')
          echo "::add-mask::$key"
          [ -n "$password" ] && echo "::add-mask::$password"
          echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Build and release (Tauri)
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 저장소 Secrets에 등록된 카카오 REST API 키 (없으면 교보 검색만 동작)
          YAMCHA_KAKAO_KEY: ${{ secrets.YAMCHA_KAKAO_KEY }}
          # 서명 키·비밀번호는 위 단계가 다듬어 GITHUB_ENV로 넘긴다 — 여기서 secrets를 다시
          # 적으면 그쪽이 이겨서 다듬은 값이 무시된다
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "YamchaMemo ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # 서명이 끝났으니 키를 환경에서 지운다. GITHUB_ENV에 넣은 값은 잡이 끝날 때까지 남아서 뒤의
      # 단계와 앞 액션들의 정리 단계(post: 캐시 저장 등)까지 다 읽을 수 있다. 빌드가 실패해도
      # 정리 단계는 돌기 때문에 always()로 둔다. (tauri-action과 그 안의 `pnpm build`는 여전히 키를
      # 본다 — 같은 스텝에서 빌드하고 서명하는 구조라 피할 수 없다.)
      - name: Drop updater signing key from the environment
        if: always()
        shell: bash
        run: |
          echo "TAURI_SIGNING_PRIVATE_KEY=" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"

      # 처음 받는 사람이 가장 먼저 만나는 벽은 서명이 없어 뜨는 설치 경고다(8-6). 넘기는 법을 릴리스 페이지
      # 맨 위에 고정 머리말로 붙인다(scripts/release-header.md). **업데이트 창(latest.json의 notes)에는
      # 넣지 않는다** — 이미 쓰는 사람에게는 소음이다. latest.json은 위 단계가 이미 만들어 올렸으므로 여기서
      # 릴리스 설명만 고친다. 두 잡이 한꺼번에 고치지 않게 Windows 잡에서만, 다시 돌아도 한 번만 붙게(표시 줄).
      - name: Put install guide on top of the release notes
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(gh release view "${{ github.ref_name }}" --json body -q .body)
          if ! grep -q "<!-- install-guide -->" <<<"$body"; then
            { cat scripts/release-header.md; printf '%s\n' "$body"; } > release-notes.md
            gh release edit "${{ github.ref_name }}" --notes-file release-notes.md
          fi

      # Mac 실행 허용 스크립트(mac-unlock.command)를 릴리스에 첨부한다.
      # 실행 권한(+x)은 zip이 macOS에서 만들어져야 보존되므로, 이 macOS 잡에서 압축한다.
      - name: Package and upload Mac unlock script
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/mac-unlock.command
          zip -j mac-unlock.zip scripts/mac-unlock.command
          gh release upload "${{ github.ref_name }}" mac-unlock.zip --clobber
