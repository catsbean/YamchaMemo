name: Release

# vX.Y.Z 태그를 push하면 Windows·macOS 설치본을 빌드해 GitHub Release 초안으로 올린다.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build and release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 저장소 Secrets에 등록된 카카오 REST API 키 (없으면 교보 검색만 동작)
          YAMCHA_KAKAO_KEY: ${{ secrets.YAMCHA_KAKAO_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "YamchaMemo ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Mac 실행 허용 스크립트(mac-unlock.command)를 릴리스에 첨부한다.
      # 실행 권한(+x)은 zip이 macOS에서 만들어져야 보존되므로, 이 macOS 잡에서 압축한다.
      - name: Package and upload Mac unlock script
        if: matrix.platform == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/mac-unlock.command
          zip -j mac-unlock.zip scripts/mac-unlock.command
          gh release upload "${{ github.ref_name }}" mac-unlock.zip --clobber
